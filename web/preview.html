<!doctype html>

<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sprig · 芽团 · 设计预览</title>
  <link rel="stylesheet" href="./bar.css">
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; color: #29483c; background: #f3f6f1; color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 80px 24px; }
    main { max-width: 720px; margin: 0 auto; }
    .eyebrow { margin: 0 0 18px; color: #6b8d78; font-size: 11px; font-weight: 600; letter-spacing: .2em; }
    .preview-tools { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 28px; }
    .preview-tools .eyebrow { margin: 0; }
    .preview-tools label { color: #687e70; font-size: 12px; }
    select { margin-left: 8px; padding: 6px 9px; border: 1px solid #cbd8cc; border-radius: 8px; background: #f8faf6; color: #29483c; font: inherit; }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 46px); font-weight: 550; letter-spacing: -.05em; }
    .intro { margin: 14px 0 42px; color: #7a8d80; font-size: 13px; line-height: 1.8; }
    .swatch { padding: 34px; border: 1px solid #dce5db; border-radius: 30px; }
    .swatch + .swatch { margin-top: 20px; }
    .swatch-light { background: #edf2ea; }
    .swatch-dark { background: #14201b; border-color: #293e31; }
    .swatch-title { display: flex; justify-content: space-between; margin: 0 0 21px; color: #87988a; font-size: 10px; font-weight: 500; letter-spacing: .08em; }
    .bar-host { max-width: 540px; margin: 0 auto; }
    .note { margin: 28px 0 0; color: #87988a; font-size: 11px; line-height: 1.9; }
    @media (max-width: 440px) { body { padding: 40px 12px; } .swatch { padding: 24px 0; border: 0; background: transparent; } .swatch-dark { padding: 24px 0; background: #14201b; } .swatch-title { padding: 0 16px; } }
  </style>
</head>
<body>
  <main>
    <div class="preview-tools"><p class="eyebrow">SPRIG / CODEX USAGE BAR</p><label>Language / 语言<select id="locale"><option value="en">English</option><option value="zh-CN">简体中文</option></select></label></div>
    <h1 id="headline">留一点余量，慢慢来。</h1>
    <p class="intro"><span id="preview-label">设计预览 · 示例数据 · 不连接 Codex</span><br><span id="intro-copy">轻轻呼吸的 Sprig · 芽团，陪你看一眼账户用量。</span></p>
    <section class="swatch swatch-light" aria-label="浅色设计预览">
      <p class="swatch-title"><span id="light-label">浅色</span><span class="example-label">示例数据</span></p>
      <div class="bar-host" id="light-preview"></div>
    </section>
    <section class="swatch swatch-dark" aria-label="深色设计预览">
      <p class="swatch-title"><span id="dark-label">深色</span><span class="example-label">示例数据</span></p>
      <div class="bar-host" id="dark-preview"></div>
    </section>
    <p class="note"><span id="interaction-copy">悬停向 Sprig · 芽团打招呼，点击看看它的回应。</span><br><span id="detail-copy">按 i 查看示例来源与状态；箭头切换紧凑布局。缓存在账户来源下始终显示未知。</span></p>
  </main>
  <script src="./sprig.js"></script>
  <script src="./bar.js"></script>
  <script>
    'use strict';
    var copy = {
      'zh-CN': { title: 'Sprig · 芽团 · 设计预览', headline: '留一点余量，慢慢来。',
        preview: '设计预览 · 示例数据 · 不连接 Codex', intro: '轻轻呼吸的 Sprig · 芽团，陪你看一眼账户用量。',
        light: '浅色', dark: '深色', example: '示例数据', source: '设计预览 / 手工示例数据（不连接 Codex）',
        interaction: '悬停向 Sprig · 芽团打招呼，点击看看它的回应。',
        detail: '按 i 查看示例来源与状态；箭头切换紧凑布局。缓存在账户来源下始终显示未知。' },
      en: { title: 'Sprig · Design preview', headline: 'A little room to keep going.',
        preview: 'Design preview · Example data · No connection to Codex', intro: 'Meet Sprig, your little 3D companion for a quick quota check.',
        light: 'LIGHT', dark: 'DARK', example: 'Example data', source: 'Design preview / synthetic example data (no connection to Codex)',
        interaction: 'Hover to say hello to Sprig, or click for a playful response.',
        detail: 'Select i for sources and status, or the arrow for a compact summary. Cache stays unknown in this account-only preview.' }
    };
    var locale = /^zh(?:[-_]|$)/i.test(navigator.language || '') ? 'zh-CN' : 'en';
    var bars = [];
    var now = Date.now();
    var example = {
      status: 'fresh', stale: false, sourceLabel: '设计预览 / 手工示例数据（不连接 Codex）',
      updatedAt: new Date(now).toISOString(), working: null,
      limits: {
        primary: { usedPercent: 32, windowMinutes: 300, resetsAt: Math.floor(now / 1000) + 10800, status: 'fresh' },
        secondary: { usedPercent: 68, windowMinutes: 10080, resetsAt: Math.floor(now / 1000) + 259200, status: 'fresh' }
      }
    };
    ['light', 'dark'].forEach(function (theme) {
      var bar = window.CodexUsageBar.mount(document.getElementById(theme + '-preview'), { accountOnly: true, theme: theme, locale: locale });
      bars.push(bar);
      bar.update(example);
      window.addEventListener('pagehide', function () { bar.destroy(); }, { once: true });
    });
    function setLocale(value) {
      locale = value === 'zh-CN' ? 'zh-CN' : 'en';
      var words = copy[locale];
      document.documentElement.lang = locale;
      document.title = words.title;
      document.getElementById('locale').value = locale;
      [['headline', 'headline'], ['preview-label', 'preview'], ['intro-copy', 'intro'],
        ['light-label', 'light'], ['dark-label', 'dark'], ['interaction-copy', 'interaction'],
        ['detail-copy', 'detail']].forEach(function (item) { document.getElementById(item[0]).textContent = words[item[1]]; });
      document.querySelectorAll('.example-label').forEach(function (node) { node.textContent = words.example; });
      document.querySelector('.swatch-light').setAttribute('aria-label', locale === 'en' ? 'Light design preview' : '浅色设计预览');
      document.querySelector('.swatch-dark').setAttribute('aria-label', locale === 'en' ? 'Dark design preview' : '深色设计预览');
      example.sourceLabel = words.source;
      bars.forEach(function (bar) { bar.setLocale(locale); bar.update(example); });
    }
    document.getElementById('locale').addEventListener('change', function (event) { setLocale(event.target.value); });
    setLocale(locale);
  </script>
</body>
</html>
