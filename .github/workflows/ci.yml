name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/build-sprig.mjs --check
      - run: python3 scripts/validate.py
      - run: python3 -B -m unittest discover -s tests -v
      - run: python3 -B -m unittest discover -s platforms/macos -p 'test_*.py' -v
      - run: node --test tests/test_frontend.js tests/test_sprig_runtime.js
      - name: Native launcher protocol checks
        run: |
          xcrun swiftc -O -framework AppKit -D LAUNCHER_TESTS platforms/macos/Launcher.swift -o "$RUNNER_TEMP/launcher-tests"
          "$RUNNER_TEMP/launcher-tests"
      - run: python3 platforms/macos/build.py
      - run: python3 platforms/macos/build.py --source-output dist/codex-usage-bar-v0.8.0-source.zip
