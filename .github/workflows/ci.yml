name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/validate.py
      - run: python3 -B -m unittest discover -s tests -v
      - run: python3 -B -m unittest discover -s platforms/macos -p 'test_*.py' -v
      - run: node --test tests/test_frontend.js
      - run: python3 platforms/macos/build.py
      - run: python3 platforms/macos/build.py --source-output dist/codex-usage-bar-v0.5.0-source.zip
